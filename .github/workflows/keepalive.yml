# Keeps the Supabase free-tier project awake (it pauses after ~7 days idle,
# which makes the project hostname stop resolving — NXDOMAIN).
# A daily lightweight authenticated request resets the inactivity timer.
name: Supabase keepalive

on:
  schedule:
    - cron: '17 6 * * *'   # daily 06:17 UTC
  workflow_dispatch:        # allow manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/profiles?select=id&limit=1")
          echo "HTTP $code"
          # 200/206 ok; 401/permission also proves the host is awake
          if [ "$code" = "000" ]; then echo "host unreachable"; exit 1; fi
